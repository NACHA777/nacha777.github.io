<!-- este archivo ejecutara MindAR de forma independiente y comunicará los resultados a la pagina principal -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconocimiento RA - USM</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #101820;
    }
    #estado {
      position: fixed;
      top: 15px;
      left: 5%;
      width: 90%;
      box-sizing: border-box;
      z-index: 10;
      padding: 12px;
      background: rgba(0, 35, 70, 0.85);
      color: white;
      border-radius: 10px;
      text-align: center;
      font: 14px Arial, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="estado">Iniciando cámara...</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>
    <!-- Objetivo 0: Testamento -->
    <a-entity
      id="objetivo-testamento"
      mindar-image-target="targetIndex: 0">
    </a-entity>
    <!-- Objetivo 1: Plaza -->
    <a-entity
      id="objetivo-plaza"
      mindar-image-target="targetIndex: 1">
    </a-entity>
  </a-scene>
  <script>
    const estado = document.querySelector("#estado");
    const testamento = document.querySelector(
      "#objetivo-testamento"
    );
    const plaza = document.querySelector(
      "#objetivo-plaza"
    );
    function configurarObjetivo(elemento, lugar, nombre) {
      elemento.addEventListener("targetFound", () => {
        estado.textContent = nombre + " reconocido";
        window.parent.postMessage(
          {
            tipo: "USM_RA_ENCONTRADA",
            lugar: lugar
          },
          window.location.origin
        );
      });
      elemento.addEventListener("targetLost", () => {
        estado.textContent = "Buscando monumento...";
        window.parent.postMessage(
          {
            tipo: "USM_RA_PERDIDA",
            lugar: lugar
          },
          window.location.origin
        );
      });
    }
    configurarObjetivo(
      testamento,
      "testamento",
      "Testamento de Federico Santa María"
    );
    configurarObjetivo(
      plaza,
      "plaza",
      "Plaza Federico Santa María"
    );
    document.querySelector("a-scene")
      .addEventListener("arReady", () => {
        estado.textContent =
          "Apunta hacia el Testamento o el monumento de la Plaza";
      });
    document.querySelector("a-scene")
      .addEventListener("arError", () => {
        estado.textContent =
          "Error al iniciar RA. Revisa los permisos de cámara.";
      });
  </script>
</body>
</html>
