<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RA del Testamento de Federico Santa María</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    /* Misma estructura del visor de Plaza que ya funcionó en iPhone. */
    body { margin: 0; overflow: hidden; background: #101820; font-family: Arial, sans-serif; }
    #estado { position: fixed; top: 12px; left: 5%; width: 90%; box-sizing: border-box;
      z-index: 20; padding: 11px; background: rgba(0,35,70,.87); color: #fff;
      border-radius: 10px; text-align: center; font-size: 13px; line-height: 1.45;
      pointer-events: none; }
  </style>
</head>
<body>
  <div id="estado" role="status" aria-live="polite">Iniciando cámara...</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets/testamento-firma.mind; autoStart: true; uiScanning: yes; uiLoading: yes"
    color-space="sRGB" renderer="colorManagement: true"
    vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="near: 0.01; far: 10000; objects: .clickable-ra"></a-camera>
    <a-entity id="objetivo-testamento" mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>
  <script>
    const estado = document.getElementById('estado');
    const escena = document.querySelector('a-scene');
    const objetivo = document.getElementById('objetivo-testamento');
    let reconocido = false;
    function avisar(tipo) {
      if (window.parent !== window) {
        window.parent.postMessage({ tipo, lugar: 'testamento' }, window.location.origin);
      }
    }
    objetivo.addEventListener('targetFound', () => {
      reconocido = true;
      estado.textContent = '¡Testamento reconocido! Explora su mensaje debajo de la cámara.';
      avisar('USM_RA_ENCONTRADA');
    });
    objetivo.addEventListener('targetLost', () => {
      if (!reconocido) estado.textContent = 'Buscando el mural del Testamento...';
      avisar('USM_RA_PERDIDA');
    });
    escena.addEventListener('arReady', () => {
      estado.textContent = 'Apunta a las últimas líneas y a la firma FEDERICO SANTA MARÍA CARRERA, en la parte derecha del muro.';
    });
    escena.addEventListener('arError', () => {
      estado.textContent = 'No se pudo iniciar la cámara. Revisa permisos y targets/testamento.mind.';
    });
  </script>
</body>
</html>
